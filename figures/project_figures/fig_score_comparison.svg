<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Test score (balanced accuracy) by condition</text>
  <text x="380" y="45" text-anchor="middle" font-size="12" fill="#666">box = Q1–Q3, line = median, &#9671; = mean, whiskers = min–max (successful cells)</text>

  <!-- Y axis + gridlines -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="90" y1="60"  x2="740" y2="60"/>
    <line x1="90" y1="135" x2="740" y2="135"/>
    <line x1="90" y1="210" x2="740" y2="210"/>
    <line x1="90" y1="285" x2="740" y2="285"/>
  </g>
  <line x1="90" y1="60" x2="90" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="360" x2="740" y2="360" stroke="#333" stroke-width="1.5"/>
  <g font-size="12" fill="#444" text-anchor="end">
    <text x="82" y="364">0.60</text>
    <text x="82" y="289">0.70</text>
    <text x="82" y="214">0.80</text>
    <text x="82" y="139">0.90</text>
    <text x="82" y="64">1.00</text>
  </g>
  <text x="34" y="210" text-anchor="middle" font-size="13" fill="#444" transform="rotate(-90 34 210)">balanced_accuracy</text>

  <!-- B0 (x=190) -->
  <line x1="190" y1="80.0" x2="190" y2="297.6" stroke="#4e79a7" stroke-width="1.5"/>
  <line x1="178" y1="80.0" x2="202" y2="80.0" stroke="#4e79a7" stroke-width="1.5"/>
  <line x1="178" y1="297.6" x2="202" y2="297.6" stroke="#4e79a7" stroke-width="1.5"/>
  <rect x="145" y="95.7" width="90" height="172.1" fill="#4e79a7" fill-opacity="0.22" stroke="#4e79a7" stroke-width="1.5"/>
  <line x1="145" y1="204.15" x2="235" y2="204.15" stroke="#4e79a7" stroke-width="2.5"/>
  <circle cx="190" cy="177.6" r="4.5" fill="#ffffff" stroke="#4e79a7" stroke-width="2"/>

  <!-- B1 (x=410) -->
  <line x1="410" y1="83.1" x2="410" y2="308.0" stroke="#59a14f" stroke-width="1.5"/>
  <line x1="398" y1="83.1" x2="422" y2="83.1" stroke="#59a14f" stroke-width="1.5"/>
  <line x1="398" y1="308.0" x2="422" y2="308.0" stroke="#59a14f" stroke-width="1.5"/>
  <rect x="365" y="99.75" width="90" height="165.05" fill="#59a14f" fill-opacity="0.22" stroke="#59a14f" stroke-width="1.5"/>
  <line x1="365" y1="204.3" x2="455" y2="204.3" stroke="#59a14f" stroke-width="2.5"/>
  <circle cx="410" cy="174.9" r="4.5" fill="#ffffff" stroke="#59a14f" stroke-width="2"/>

  <!-- B2 (x=630) -->
  <line x1="630" y1="69.0" x2="630" y2="337.1" stroke="#e15759" stroke-width="1.5"/>
  <line x1="618" y1="69.0" x2="642" y2="69.0" stroke="#e15759" stroke-width="1.5"/>
  <line x1="618" y1="337.1" x2="642" y2="337.1" stroke="#e15759" stroke-width="1.5"/>
  <rect x="585" y="95.7" width="90" height="169.1" fill="#e15759" fill-opacity="0.22" stroke="#e15759" stroke-width="1.5"/>
  <line x1="585" y1="109.0" x2="675" y2="109.0" stroke="#e15759" stroke-width="2.5"/>
  <circle cx="630" cy="168.8" r="4.5" fill="#ffffff" stroke="#e15759" stroke-width="2"/>

  <!-- x labels -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="190" y="382">B0 (naive)</text>
    <text x="410" y="382">B1 (schema)</text>
    <text x="630" y="382">B2 (meta-feature)</text>
  </g>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="190" y="398">n = 90</text>
    <text x="410" y="398">n = 90</text>
    <text x="630" y="398">n = 56</text>
  </g>

  <text x="380" y="440" text-anchor="middle" font-size="11" fill="#666">Conditions overlap; the paired Wilcoxon test finds no significant difference (all p &gt; 0.09).</text>
  <text x="380" y="456" text-anchor="middle" font-size="11" fill="#666">B2's higher median is survivorship bias — only its 56 successful cells contribute.</text>
</svg>
